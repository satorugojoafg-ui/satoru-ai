name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # تنظیم جاوا 21 و 17 جهت پشتیبانی کامل از گریدل اندروید
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # ایجاد فایل‌های ضروری محیطی تا بیلد متوقف نشود
      - name: Create Env and Properties
        run: |
          touch .env
          echo "GEMINI_API_KEY=" >> .env
          touch local.properties

      # نصب مستقیم Gradle در سیستم ابری گیت‌هاب برای اطمینان ۱۰۰٪
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # ساخت خودکار فایل اجرایی گریدل اگر در سورس وجود نداشت
      - name: Ensure gradlew exists
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      # ساخت فایل نصبی APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      # آپلود فایل APK برای دانلود
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gojo-AI-App
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
