name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # امکان اجرای دستی با یک کلیک از تب Actions

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # ۱. دریافت کدهای پروژه
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ۲. تنظیم جاوا ۱۷ (نسخه استاندارد پروژه‌های جدید اندروید)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ۳. ساخت فایل env خالی (جهت عدم ارور secrets-gradle-plugin)
      - name: Create Dummy .env
        run: touch .env

      # ۴. مجوز دادن به گریدل
      - name: Grant execute permission for gradlew
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            gradle wrapper
            chmod +x gradlew
          fi

      # ۵. کامپایل و ساخت فایل APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # ۶. خروجی و آپلود فایل APK برای دانلود
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gojo-AI-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
